# lio_perception.service drop-in: keep this vendor node off rl_deploy's RT cores 4-5 (its script pins it to 4-7, which made rl_deploy's 1 kHz cycle run late).
# Installed by m20tool setup (aos/vendor-cpuset); removed by: m20tool setup-step aos/vendor-cpuset --revert
[Service]
ExecStart=
ExecStart=/opt/robot/vendor_fixes/in_cpuset.sh 6-7 /opt/robot/share/lio_perception/scripts/lio_ddsnode.sh

# ctrlmcu.service drop-in: hide tailscale0 from ctrlmcu_node so its .104/.106 IP guard passes on restarts.
# Installed by m20tool setup (aos/ctrlmcu-hide-tailscale), with /opt/robot/vendor_fixes/hide_tailscale.so; removed by:
# m20tool setup-step aos/ctrlmcu-hide-tailscale --revert
[Service]
Environment=LD_PRELOAD=/opt/robot/vendor_fixes/hide_tailscale.so

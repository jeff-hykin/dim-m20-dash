# rl_deploy.service drop-in: Fast-DDS on UDPv4 only (no shared memory), so the vendor IMU (yesense_node -> rl_deploy /IMU_DATA)
# crosses loopback where m20_shadow's sniffer sees it, as in the 2026-11-20 recordings. DrDDS loads only
# /opt/drdds/dr_qos/drqos.xml, whose participant profile keeps the builtin transports, which this env var picks.
# Opt-in, installed by: m20tool setup-step aos/imu-udp; removed by: m20tool setup-step aos/imu-udp --revert
[Service]
Environment=FASTDDS_BUILTIN_TRANSPORTS=UDPv4

# m20tool: the camera relay (m20-camera.service) on AOS's big cores. AOS boots with isolcpus=4-7 (the vendor pins
# its lidar, IMU and SLAM there itself), so unpinned work stays on the four small A55s, where the front camera's
# pipeline couldn't hold 30 fps (84% of a core, restarted for it). On an A76 each pipeline is ~4% of a core.
# 6 and 7: the least loaded of the vendor's big cores.
[Service]
CPUAffinity=6 7

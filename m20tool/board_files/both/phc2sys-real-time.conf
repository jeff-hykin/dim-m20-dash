[Service]
# real time on top of the robot's PTP time base: the offset real-time-offset keeps in /run/phc2sys-offset.env (0 until
# it has one, the robot's original behavior)
Environment=PHC2SYS_OFFSET=0
EnvironmentFile=-/run/phc2sys-offset.env
ExecStart=
ExecStart=/usr/sbin/phc2sys -m -s eth0 -c CLOCK_REALTIME -w -O ${PHC2SYS_OFFSET}

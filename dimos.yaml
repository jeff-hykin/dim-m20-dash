title: M20 Ctrl
spec-version: v1.6
version: 0.3.10
uses:
  '@dimos-gateway':
    - GET history/recordings
    - GET active
    - GET active/streams
    - 'GET active/streams/{name}/peek'
    - GET active/modules
    - 'POST active/modules/{id}/rpcs/{name}'
    - GET msgs.js
  '@desktop-gateway':
    env:
      DIMOS_APP.socket: the unix socket this server binds
      DIMOS_APP.dataDir: 'its own folder, for its log and settings'
      DIMOS_APP.desktopUrl: 'Desktop''s loopback origin, which the dimos gateway is asked through'
      DIMOS_APP.recordingsDir:
        required: false
        description: where recordings go until the gateway has answered
    endpoints:
      - GET management/gateways/zenoh
  '@zenoh-gateway': '>=0.5 <0.6'
provides:
  info:
    x-when: 'you need to monitor a Deep Robotics M20 quadruped''s computers, record them, or command it through a blueprint'
    title: M20 Ctrl
    version: 1.2.0
    description: >-
      M20 Ctrl: monitor a Deep Robotics Lynx M20 quadruped's computers (GOS, AOS, NOS) — CPU, temperature, memory,
      network, lidar and dimos — record them, and in blueprint mode watch, record and command the running dimos
      blueprint
  openapi: 3.1.0
  paths:
    /api/state:
      get:
        description: >-
          Everything the panel shows: mode (blueprint|direct), source (ssh|fake), boards [{name, label, hosts, link
          {state, host, error}, reachable, indicators {network, stats, lidar, dimos: {level ok|warn|bad|off|unknown,
          text}}, latest (CPU total + per core %, load, memory, temperatures, lidar/dimos processes, uptime)}],
          blueprint (blueprint mode: running, blueprint, streams, connection, peeked stream values), record, robot (the
          M20's own status: GET api/robot)
        x-when: 'you want the M20''s boards'' health (CPU, network, lidar, dimos) or what the running blueprint is doing'
        x-dimos-role: context
        parameters:
          - name: history
            in: query
            schema:
              type: boolean
            description: include each board's last 2 minutes of CPU (the charts)
    '/api/boards/{name}':
      get:
        description: 'One board (gos, aos, nos, …): its link, indicators, latest sample and CPU history; 404 for an unknown name'
        x-when: you want one M20 board's latest stats and indicators
        parameters:
          - name: name
            in: path
            required: true
            schema:
              type: string
            description: the board's name (GET api/settings lists them)
    /api/robot:
      get:
        description: >-
          The M20's own status, from its basic_server's reports (M20 Ctrl only heartbeats it, never commands it): {link
          (up|down|connecting|off|error), basic {motionName, gaitName, chargeName, hardEstop, usage, sleep}, motion
          {roll, pitch, yaw, height, vx, vy, wz}, battery {left, right: {level %, voltage, celsius, charging, present}},
          joints [{joint, motor °C, driver °C}], hottestMotor, hottestDriver, errors [{hex, name, parts}]}
        x-when: 'you want the M20''s battery, motor temperatures, errors, e-stop, motion state, gait or charging'
        x-dimos-role: context
    /api/mode:
      put:
        description: >-
          blueprint: M20 Ctrl drives and commands the robot through the running dimos blueprint (tele_cmd_vel and
          M20Connection's RPCs; the robot must be in navigation control mode). direct: through the robot's own
          basic_server (axis commands; regular control mode). While a blueprint runs, blueprint mode is the default:
          direct chosen now holds until the next run starts. Returns {mode}
        x-when: you need to switch between blueprint mode and direct mode
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    description: blueprint or direct
                required:
                  - mode
    /api/motion:
      post:
        description: >-
          MOVES THE ROBOT. action: standup, liedown, dock, stop. Blueprint mode: the running blueprint's M20Connection
          liedown / dock / stop_movement RPC through the dimos gateway (409 when no blueprint with M20Connection runs or
          it lacks that RPC); standup = `m20 stand` (stand, RL control, navigation mode, agile stairs gait). Direct
          mode: standup = `m20 direct` (stand, RL control, regular mode, basic gait); liedown = zero axes, sit; dock =
          `m20 dock`; stop = zero axes. Either mode: undock = `m20 undock` (leave the dock, then stand). dock starts
          self-charging (the robot must stand still about 2 m in front of the dock, facing it). Returns {ok, result,
          error} (or {dryRun, wouldCall|wouldDo})
        x-when: 'the M20 should stand up, lie down, dock to charge or stop'
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    description: 'standup, liedown, dock, undock or stop'
                  dryRun:
                    type: boolean
                    description: 'validate and return what would be called, without calling it'
                required:
                  - action
    /api/drive/enable:
      post:
        description: >-
          MOVES THE ROBOT (it stands up). Puts the robot in the state the current mode drives in. Blueprint mode: `m20
          stand` (stand, RL control, navigation mode, agile stairs gait; refuses on the dock). Direct mode: `m20 direct`
          (stand, RL control, regular mode, basic gait). Returns {ok, result | error} ({dryRun, wouldDo} with dryRun)
        x-when: the M20 won't drive (GET api/state's driving says why) and should be made ready to
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun:
                    type: boolean
                    description: 'say what it would do, without doing it'
    /api/gait:
      post:
        description: >-
          MOVES THE ROBOT (its stance changes). Sends the gait (2/23) to the robot's basic_server and waits for its
          report to confirm it (5 s, one retry). gait: 0x1001 basic (direct mode's default), 0x1002 high obstacles,
          0x1003 stairs (standard), 0x3002 flat (agile), 0x3003 stairs (agile; the blueprint's), 0x3004 off-road (agile,
          undocumented). Either mode. Returns {ok, result | error} ({dryRun, wouldDo} with dryRun)
        x-when: the M20 should change its gait (how it walks)
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  gait:
                    type: number
                    description: 'the gait code, e.g. 4097 (0x1001) for basic'
                  dryRun:
                    type: boolean
                    description: 'say what it would do, without doing it'
                required:
                  - gait
    /api/direct/move:
      post:
        description: >-
          MOVES THE ROBOT. Direct mode only: axis commands to the robot's basic_server at 20 Hz for durationMs (at most
          500), then zeros. x forward, y left, yaw counterclockwise, each -1..1 (a share of the robot's top speed). 409
          when the robot can't drive now (GET api/state's driving says why)
        x-when: the M20 should move in direct mode (hold it by calling again within durationMs)
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  x:
                    type: number
                    description: 'forward (+) / back, -1..1'
                  'y':
                    type: number
                    description: 'left (+) / right, -1..1'
                  yaw:
                    type: number
                    description: 'turn left (+) / right, -1..1'
                  durationMs:
                    type: number
                    description: how long it holds without another call (≤ 500)
                required:
                  - x
    /api/direct/stop:
      post:
        summary: 'Zero axis commands now (and for half a second after). Any mode; returns {moving: false}'
        x-when: the M20 should stop moving in direct mode
    /api/blueprint:
      get:
        description: >-
          Blueprint mode's view: {running, blueprint, runId, error, streams [{name, type, direction, module}],
          connection {id, rpcs} (its M20Connection), peeked {stream: {type, value, ts, at}}} (its streams are sampled in
          blueprint mode only)
        x-when: 'you want the running dimos blueprint''s streams and their latest values, as M20 Ctrl sees them'
    /api/settings:
      get:
        description: >-
          {boards [{name, label, hosts (ssh targets, tried in order), role, expectLidar, expectDimos}], source
          (ssh|fake), mode, patterns {lidar, dimos (regexes for ps), lidarPorts}, blueprintStreams}
        x-when: you want the M20 boards M20 Ctrl watches and how it reaches them
      put:
        description: >-
          Change any subset of the settings (see GET api/settings); reset: true starts from the defaults. Saved, and the
          board links restart if boards, source or patterns changed. Returns the new settings; 400 if invalid
        x-when: 'you need to change the boards, their addresses, fake boards or the watched blueprint streams'
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  boards:
                    type: array
                    description: '[{name, label, hosts: [user@host, …], role?, expectLidar?, expectDimos?}]'
                  source:
                    type: string
                    description: ssh (the real boards) or fake (simulated boards)
                  mode:
                    type: string
                    description: blueprint or direct
                  patterns:
                    type: object
                    description: '{lidar, dimos: regexes matched against ps args; lidarPorts}'
                  blueprintStreams:
                    type: array
                    description: stream names to sample in blueprint mode
                  reset:
                    type: boolean
                    description: restore the defaults first
    /api/record:
      get:
        description: >-
          The recording in progress: {active: true, file, path, startedAt (ms), seconds, bytes, messages, topics,
          space}; or {active: false, space}. space: {freeBytes (on the recordings' disk), reserveBytes (a recording
          stops itself there), bytesPerSecond, rateSource (measured: this recording's, smoothed; last_recording /
          options: an estimate for the next one), estimate, secondsLeft (until it would stop itself), low (under 5 min)}
        x-when: 'you want to know whether M20 Ctrl is recording, and its size'
    /api/record/start:
      post:
        description: >-
          Record to an .mcap in Desktop's recordings folder (m20/[<folder>/]<date>_<time>_m20_<host>[_<label>].mcap)
          what the Record options pick (GET api/record/options): the live topics raw (cameras, lidar, map, pose, tf,
          driving and commands; each with its rate cap), the robot status reports, the board stats, the blueprint
          samples; always /robot_action and /logs. Splits into _partN files by the options' minutes / MB. Runs until
          api/record/stop or the app quits. Returns its status (as GET api/record); if one is already running, that
          one's
        x-when: 'you need to record the M20''s board stats (and, in blueprint mode, the blueprint''s streams) to an mcap'
    /api/record/stop:
      post:
        description: >-
          Stop the recording and finish its file: {active: false, stopped: true, file, path, bytes, messages}, or
          {active: false, stopped: false} if none was running
        x-when: you need to stop M20 Ctrl's recording
    /api/record/options:
      get:
        description: >-
          The Record options: {options {streams {<group>: {on, maxHz (null: its own rate)}}, label, folder,
          splitMinutes, splitMb}, groups [{id, label, about, keys (zenoh keys, recorded raw), fullRate}]}
        x-when: 'you want to know what M20 Ctrl''s recordings hold, or what can be recorded'
      put:
        description: >-
          Change the Record options (any subset; a stream group you leave out keeps its setting); they apply from the
          next recording. Returns them; 400 if invalid
        x-when: 'you need to change what M20 Ctrl records (streams, rate caps, file label, folder, splitting)'
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  streams:
                    type: object
                    description: '{<group id>: {on: bool, maxHz: number|null}} (ids: GET api/record/options)'
                  label:
                    type: string
                    description: 'added to the file name: letters, digits, - and _'
                  folder:
                    type: string
                    description: a folder inside m20/ ("" for m20/ itself)
                  splitMinutes:
                    type: number
                    description: 'a new _partN file after this many minutes (null: never)'
                  splitMb:
                    type: number
                    description: 'a new _partN file after this many MB (null: never)'
    /api/recordings/download:
      get:
        summary: The .mcap itself (as a download); file is a name GET api/recordings lists. 404 for anything else
        x-when: you need one of M20 Ctrl's recording files
        parameters:
          - name: file
            in: query
            schema:
              type: string
            required: true
            description: 'the file, as GET api/recordings names it'
    /api/recordings:
      get:
        description: >-
          This app's recordings: {directory, recordings: [{file, bytes, modified (ISO time), recording (still being
          written)}]}, newest first
        x-when: you want the list of M20 Ctrl's recording files
    /api/fake:
      put:
        description: >-
          Fake boards only: pin a board's simulated condition — reachable (bool), lidar (publishing|idle|off), dimos
          (bool), busy (0-1 CPU) — or clear: true to go back to its script. Returns {board, overrides}; 409 when the
          source isn't fake
        x-when: you want a fake board to show a condition (testing the panel without the dog)
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  board:
                    type: string
                    description: the board's name
                  reachable:
                    type: boolean
                    description: on the network or not
                  lidar:
                    type: string
                    description: 'publishing, idle or off'
                  dimos:
                    type: boolean
                    description: dimos running or not
                  busy:
                    type: number
                    description: 'CPU load, 0-1'
                  clear:
                    type: boolean
                    description: drop the overrides
                required:
                  - board

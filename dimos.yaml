title: M20 Ctrl
spec-version: v1.6
version: 0.1.0
uses:
  '@dimos-gateway':
    - GET history/recordings
    - GET active
    - GET active/streams
    - 'GET active/streams/{name}/peek'
    - GET active/modules
    - 'POST active/modules/{id}/rpcs/{name}'
  '@desktop-gateway':
    env:
      DIMOS_APP.socket: the unix socket this server binds
      DIMOS_APP.dataDir: 'its own folder, for its log and settings'
      DIMOS_APP.desktopUrl: 'Desktop''s loopback origin, which the dimos gateway is asked through'
      DIMOS_APP.recordingsDir:
        required: false
        description: where recordings go until the gateway has answered
provides:
  info:
    x-when: 'you need to monitor a Deep Robotics M20 quadruped''s computers, record them, or command it through a blueprint'
    title: M20 Ctrl
    version: 1.0.0
    description: >-
      M20 Ctrl: monitor a Deep Robotics Lynx M20 quadruped's computers (GOS, AOS, NOS) — CPU, temperature, memory,
      network, lidar and dimos — record them, and in blueprint mode watch, record and command the running dimos
      blueprint
  openapi: 3.1.0
  paths:
    /api/state:
      get:
        description: >-
          Everything the panel shows: mode (blueprint|direct), source (ssh|fake), boards [{name, label, hosts, link
          {state, host, error}, reachable, indicators {network, stats, lidar, dimos: {level ok|warn|bad|off|unknown,
          text}}, latest (CPU total + per core %, load, memory, temperatures, lidar/dimos processes, uptime)}],
          blueprint (blueprint mode: running, blueprint, streams, connection, peeked stream values), record
        x-when: 'you want the M20''s boards'' health (CPU, network, lidar, dimos) or what the running blueprint is doing'
        x-dimos-role: context
        parameters:
          - name: history
            in: query
            schema:
              type: boolean
            description: include each board's last 2 minutes of CPU (the charts)
    '/api/boards/{name}':
      get:
        description: 'One board (gos, aos, nos, …): its link, indicators, latest sample and CPU history; 404 for an unknown name'
        x-when: you want one M20 board's latest stats and indicators
        parameters:
          - name: name
            in: path
            required: true
            schema:
              type: string
            description: the board's name (GET api/settings lists them)
    /api/mode:
      put:
        description: >-
          blueprint: M20 Ctrl watches and records the running dimos blueprint's streams and sends motion through its
          M20Connection RPCs (never its own robot connection). direct: boards only; motion is not available. Returns
          {mode}
        x-when: you need to switch between blueprint mode and direct mode
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    description: blueprint or direct
                required:
                  - mode
    /api/motion:
      post:
        description: >-
          MOVES THE ROBOT. action: standup, liedown, stop — the running blueprint's M20Connection standup / liedown /
          stop_movement RPC through the dimos gateway. Blueprint mode only (501 in direct mode); 409 when no blueprint
          with M20Connection runs. Returns {ok, rpc, module, result, error}
        x-when: 'the M20 should stand up, lie down or stop'
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    description: 'standup, liedown or stop'
                  dryRun:
                    type: boolean
                    description: 'validate and return what would be called, without calling it'
                required:
                  - action
    /api/blueprint:
      get:
        description: >-
          Blueprint mode's view: {running, blueprint, runId, error, streams [{name, type, direction, module}],
          connection {id, rpcs} (its M20Connection), peeked {stream: {type, value, ts, at}}}; 409 in direct mode
        x-when: 'you want the running dimos blueprint''s streams and their latest values, as M20 Ctrl sees them'
    /api/settings:
      get:
        description: >-
          {boards [{name, label, hosts (ssh targets, tried in order), role, expectLidar, expectDimos}], source
          (ssh|fake), mode, patterns {lidar, dimos (regexes for ps), lidarPorts}, blueprintStreams}
        x-when: you want the M20 boards M20 Ctrl watches and how it reaches them
      put:
        description: >-
          Change any subset of the settings (see GET api/settings); reset: true starts from the defaults. Saved, and the
          board links restart if boards, source or patterns changed. Returns the new settings; 400 if invalid
        x-when: 'you need to change the boards, their addresses, fake boards or the watched blueprint streams'
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  boards:
                    type: array
                    description: '[{name, label, hosts: [user@host, …], role?, expectLidar?, expectDimos?}]'
                  source:
                    type: string
                    description: ssh (the real boards) or fake (simulated boards)
                  mode:
                    type: string
                    description: blueprint or direct
                  patterns:
                    type: object
                    description: '{lidar, dimos: regexes matched against ps args; lidarPorts}'
                  blueprintStreams:
                    type: array
                    description: stream names to sample in blueprint mode
                  reset:
                    type: boolean
                    description: restore the defaults first
    /api/record:
      get:
        description: >-
          The recording in progress: {active: true, file, path, startedAt (ms), seconds, bytes, messages, topics}; or
          {active: false}
        x-when: 'you want to know whether M20 Ctrl is recording, and its size'
    /api/record/start:
      post:
        description: >-
          Record to an .mcap in Desktop's recordings folder (m20/<date>_<time>_m20_<host>.mcap): /boards/<board>/stats
          and /link, in blueprint mode /blueprint/<stream> (each watched stream, sampled once a second), /robot_action
          and /logs. Runs until api/record/stop or the app quits. Returns its status (as GET api/record); if one is
          already running, that one's
        x-when: 'you need to record the M20''s board stats (and, in blueprint mode, the blueprint''s streams) to an mcap'
    /api/record/stop:
      post:
        description: >-
          Stop the recording and finish its file: {active: false, stopped: true, file, path, bytes, messages}, or
          {active: false, stopped: false} if none was running
        x-when: you need to stop M20 Ctrl's recording
    /api/recordings:
      get:
        description: >-
          This app's recordings: {directory, recordings: [{file, bytes, modified (ISO time), recording (still being
          written)}]}, newest first
        x-when: you want the list of M20 Ctrl's recording files
    /api/fake:
      put:
        description: >-
          Fake boards only: pin a board's simulated condition — reachable (bool), lidar (publishing|idle|off), dimos
          (bool), busy (0-1 CPU) — or clear: true to go back to its script. Returns {board, overrides}; 409 when the
          source isn't fake
        x-when: you want a fake board to show a condition (testing the panel without the dog)
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  board:
                    type: string
                    description: the board's name
                  reachable:
                    type: boolean
                    description: on the network or not
                  lidar:
                    type: string
                    description: 'publishing, idle or off'
                  dimos:
                    type: boolean
                    description: dimos running or not
                  busy:
                    type: number
                    description: 'CPU load, 0-1'
                  clear:
                    type: boolean
                    description: drop the overrides
                required:
                  - board

<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 53 53" width="64" height="64" role="img" aria-label="M20 Ctrl">
  <!-- dimOS app icon set v6: Deep Robotics M20 (wheel-legged quadruped) with a CPU pulse line -->
  <defs>
    <radialGradient id="tile" cx=".5" cy=".18" r=".95"><stop offset="0" stop-color="#0c2a3a"/><stop offset="1" stop-color="#07070f"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".25" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50"><stop offset="0" stop-color="#a6f0ff"/><stop offset="1" stop-color="#2d8cff"/></linearGradient>
    <g id="glyph">
      <path d="M17 25H45L48 29V33H17Z" fill="none" stroke="url(#a)" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M45 25L49 20H52" fill="none" stroke="url(#a)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 33L17 40L21 46M27 33L31 40L27 46M37 33L33 40L37 46M43 33L47 40L43 46" fill="none" stroke="url(#a)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="47" r="2.4" fill="url(#a)"/><circle cx="27" cy="47" r="2.4" fill="url(#a)"/>
      <circle cx="37" cy="47" r="2.4" fill="url(#a)"/><circle cx="43" cy="47" r="2.4" fill="url(#a)"/>
      <path d="M20 19H24L26 15L29 22L31 19H36" fill="none" stroke="url(#a)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".8"/></g>
